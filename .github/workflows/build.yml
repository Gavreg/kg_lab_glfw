name: Build

on:
  push:
    branches:
      - test_ci
  pull_request:
    branches:
      - test_ci
jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

      run: |
        cd "LAB1"
        cmake -B build
        cmake --build build

      